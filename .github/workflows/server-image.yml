name: Server image

on:
  pull_request:
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/server-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/server-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "tags=ghcr.io/louismollick/kashi-koi-server:latest,ghcr.io/louismollick/kashi-koi-server:sha-${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
