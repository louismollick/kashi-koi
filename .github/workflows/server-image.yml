name: Server image

on:
  pull_request:
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/server-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/server-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main publishes :main, a PR publishes :pr-<number> so it can be tried on the VPS before merging.
      - name: Image tags
        id: tags
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANNEL: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
        run: |
          image=ghcr.io/louismollick/kashi-koi-server
          echo "tags=$image:$CHANNEL,$image:sha-${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
