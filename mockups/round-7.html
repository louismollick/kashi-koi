<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Round 7: Sunburst Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mochiy+Pop+One&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
    <style>
    .S {
      --navy: #10224a;
      --pink: #ff5fae;
      --yel: #ffe14d;
      --mint: #8af0b0;
      --line: #10224a;
      --hair: #10224a;
      --a1: #ff5fae;
      --a3: #8af0b0;
      --hit: #2fe07a;
      background: #33b7ff;
      color: var(--navy);
      font-family: "Fredoka", "Mochiy Pop One";
      font-size: 13px;
      border-color: #333;
    }
    .S .bg {
      position: absolute;
      inset: 0;
      background: repeating-conic-gradient(from 0deg at 50% 32%, #33b7ff 0 7.5deg, #5cc8ff 7.5deg 15deg);
    }
    .S .band {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 84px;
      background: var(--navy);
      border-bottom: 3px solid #fff;
    }
    .S .status {
      position: relative;
      z-index: 2;
      color: #fff;
    }
    .S .scr {
      position: relative;
      z-index: 2;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
    }
    .H {
      font-family: "Mochiy Pop One";
      font-weight: 400;
    }
    .ol {
      color: #fff;
      -webkit-text-stroke: 6px var(--navy);
      paint-order: stroke fill;
      font-family: "Mochiy Pop One";
    }
    .sh {
      text-shadow: 2px 2px 0 var(--navy);
      color: #fff;
      font-family: "Mochiy Pop One";
    }

    .S .top {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
      margin-bottom: 12px;
    }
    .S .logo {
      font-family: "Mochiy Pop One";
      color: var(--yel);
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .fish {
      width: 30px;
      height: 18px;
      flex: none;
    }
    .S .ttlbar {
      color: #fff;
      font-family: "Mochiy Pop One";
      font-size: 18px;
    }
    .S .gear {
      color: #fff;
      font-size: 17px;
    }
    .toast {
      position: absolute;
      left: 0;
      right: 74px;
      top: -30px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: var(--navy);
      border: 2px solid #fff;
      border-radius: 10px;
      padding: 3px 9px;
      z-index: 4;
    }
    .toast span {
      color: var(--mint);
      font-weight: 700;
    }
    .toast b {
      margin-left: auto;
      color: var(--yel);
      font-family: "Mochiy Pop One";
      font-weight: 400;
    }
    .rcount {
      position: absolute;
      left: 2px;
      top: -22px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: rgba(16, 34, 74, 0.55);
      border-radius: 8px;
      padding: 1px 8px;
      z-index: 3;
    }
    .rcount span {
      color: var(--pink);
    }
    .S .qt {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #fff;
      font-family: "Mochiy Pop One";
      font-size: 12px;
    }
    .S .qt i {
      display: block;
      width: 36px;
      height: 22px;
      border-radius: 12px;
      border: 2.5px solid #fff;
      background: #334a78;
      position: relative;
      box-sizing: border-box;
    }
    .S .qt i::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
    }
    .S .qt.on i {
      background: var(--yel);
    }
    .S .qt.on i::after {
      left: 17px;
      background: var(--navy);
    }
    .S .back {
      color: #fff;
      font-size: 20px;
      width: 24px;
    }

    .box {
      background: #fff;
      border: 3px solid var(--navy);
      border-radius: 12px;
      box-shadow: 0 4px 0 var(--navy);
    }
    .btn3 {
      border: 3.5px solid var(--navy);
      border-radius: 12px;
      box-shadow: 0 5px 0 var(--navy);
    }
    .cov {
      border-radius: 5px;
      flex: none;
    }
    .c1 {
      background: linear-gradient(135deg, #3a1d5c, #c2410c 70%, #fbbf24);
    }
    .c2 {
      background: linear-gradient(135deg, #0f3d3e, #4ade80);
    }
    .c3 {
      background: linear-gradient(135deg, #1e3a8a, #93c5fd);
    }
    .c4 {
      background: linear-gradient(135deg, #4c1d95, #f472b6);
    }
    .c5 {
      background: linear-gradient(135deg, #7c2d12, #fdba74);
    }
    .c6 {
      background: linear-gradient(135deg, #134e4a, #99f6e4);
    }

    /* home */
    .cta {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--pink);
      margin-bottom: 18px;
      flex: none;
    }
    .cta .n {
      font-size: 40px;
      line-height: 1;
    }
    .cta .t b {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }
    .cta .t span {
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
    }
    .cta .go {
      margin-left: auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .caught {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      margin-bottom: 18px;
      font-weight: 600;
      flex: none;
    }
    .caught b {
      font-family: "Mochiy Pop One";
      font-weight: 400;
    }
    .sec {
      font-size: 15px;
      margin: 0 0 8px 2px;
      flex: none;
    }
    .rgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: none;
    }
    .rgrid .tile {
      padding: 5px;
    }
    .rgrid .cov {
      width: 100%;
      aspect-ratio: 1;
      display: block;
    }
    .rgrid .nm {
      font-weight: 700;
      font-size: 12px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
    }
    .rgrid .ar {
      font-size: 11px;
      opacity: 0.7;
    }
    .mini {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      margin-top: auto;
      flex: none;
      font-weight: 600;
      line-height: 1.2;
    }
    .mini .cov {
      width: 34px;
      height: 34px;
    }
    .mini small {
      opacity: 0.7;
      font-weight: 500;
    }
    .mini .pp {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--yel);
      border: 2.5px solid var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex: none;
    }
    .tabs {
      display: flex;
      margin: 10px -14px 0;
      background: var(--navy);
      border-top: 3px solid #fff;
      padding: 9px 10px 18px;
      gap: 8px;
      flex: none;
    }
    .tabs span {
      flex: 1;
      text-align: center;
      font-family: "Mochiy Pop One";
      font-size: 12px;
      color: #7fa6d6;
      padding: 6px 0;
      border-radius: 10px;
      position: relative;
    }
    .tabs .on {
      background: var(--yel);
      color: var(--navy);
    }
    .tabs .badge {
      position: absolute;
      top: -12px;
      right: -2px;
      background: var(--pink);
      color: #fff;
      border: 2.5px solid #fff;
      border-radius: 10px;
      font-size: 10px;
      padding: 0 6px;
      line-height: 16px;
    }

    /* library */
    .search {
      padding: 9px 12px;
      font-weight: 600;
      margin-bottom: 10px;
      flex: none;
    }
    .seg {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex: none;
    }
    .seg span {
      background: #fff;
      border: 2.5px solid var(--navy);
      border-radius: 8px;
      font-weight: 700;
      font-size: 11px;
      padding: 3px 7px;
    }
    .seg .on {
      background: var(--yel);
    }
    .lgrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      flex: none;
    }
    .lgrid .tile {
      padding: 4px;
    }
    .lgrid .cov {
      width: 100%;
      aspect-ratio: 1;
      display: block;
    }
    .lgrid .nm {
      font-weight: 700;
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
    }
    .lgrid .ar {
      font-size: 10px;
      opacity: 0.7;
    }

    /* review */
    .starts {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex: none;
    }
    .starts .btn3 {
      padding: 10px 10px 9px;
    }
    .starts .p {
      flex: 1.35;
      background: var(--yel);
    }
    .starts .s {
      flex: 1;
      background: #fff;
    }
    .starts b {
      display: block;
      font-family: "Mochiy Pop One";
      font-weight: 400;
      font-size: 17px;
    }
    .starts span {
      font-size: 11px;
      font-weight: 600;
    }
    .rlist {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .gh {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 2px 2px 6px;
      font-size: 14px;
      flex: none;
    }
    .gh small {
      font-family: "Fredoka";
      font-size: 11px;
      color: #fff;
      font-weight: 600;
    }
    .item {
      padding: 7px 9px;
      margin-bottom: 9px;
      flex: none;
      position: relative;
    }
    .item .meta {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 600;
    }
    .item .cov {
      width: 22px;
      height: 22px;
      border-radius: 4px;
    }
    .item .meta .r {
      margin-left: auto;
      opacity: 0.65;
    }
    .item .ly {
      font-family: "Mochiy Pop One";
      font-size: 13px;
      line-height: 1.45;
      margin-top: 5px;
    }
    .item.new {
      background: #fff7fb;
    }
    .newtag {
      position: absolute;
      top: -9px;
      left: -6px;
      background: var(--pink);
      color: #fff;
      border: 2.5px solid var(--navy);
      border-radius: 8px;
      font-size: 9px;
      font-family: "Mochiy Pop One";
      padding: 0 6px;
      line-height: 15px;
      transform: rotate(-6deg);
    }
    .nudge {
      display: flex;
      gap: 5px;
      margin-left: auto;
    }
    .nudge span {
      width: 24px;
      height: 22px;
      border: 2.5px solid var(--navy);
      border-radius: 7px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 0 2px 0 var(--navy);
    }
    .later {
      padding: 8px 10px;
      font-weight: 700;
      display: flex;
      flex: none;
    }
    .later span:last-child {
      margin-left: auto;
    }

    /* listen player */
    .nowc {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex: none;
    }
    .nowc .cov {
      width: 54px;
      height: 54px;
      border: 3px solid var(--navy);
      border-radius: 10px;
    }
    .nowc .tt {
      font-size: 17px;
    }
    .nowc .ta {
      color: #fff;
      font-weight: 700;
      font-size: 12px;
    }
    .lyrics {
      flex: 1;
      overflow: hidden;
      font-family: "Mochiy Pop One";
      font-size: 14px;
      line-height: 1.55;
    }
    .lyrics p {
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 2px 2px 0 var(--navy);
    }
    .lyrics p.cur {
      background: #fff;
      color: var(--navy);
      text-shadow: none;
      border: 3.5px solid var(--navy);
      border-radius: 14px;
      box-shadow: 0 5px 0 var(--navy);
      padding: 8px 10px;
      font-size: 18px;
    }
    .lyrics rt {
      font-size: 9px;
    }
    .mk {
      color: var(--yel);
      font-size: 10px;
    }
    .prog {
      height: 12px;
      background: #fff;
      border: 2.5px solid var(--navy);
      border-radius: 5px;
      margin: 6px 0 12px;
      flex: none;
    }
    .prog i {
      display: block;
      height: 100%;
      width: 32%;
      background: var(--pink);
    }
    .trans {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-bottom: 12px;
      flex: none;
    }
    .tb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--navy);
      box-shadow: 0 3px 0 var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex: none;
    }
    .tb.big {
      width: 50px;
      height: 50px;
      font-size: 16px;
      background: var(--yel);
    }
    .lost {
      height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--pink);
      margin-bottom: 18px;
      flex: none;
      border-radius: 18px;
      border-width: 4px;
      box-shadow: 0 7px 0 var(--navy);
    }
    .lost b {
      font-size: 30px;
      line-height: 1.15;
    }
    .lost small {
      font-weight: 700;
      font-size: 11px;
      margin-top: 4px;
    }

    /* quiz */
    .qtitle {
      color: #fff;
      font-family: "Mochiy Pop One";
      font-size: 14px;
      line-height: 1.2;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .qtitle small {
      display: block;
      font-family: "Fredoka";
      font-size: 11px;
      color: #a9c4ea;
    }
    .lane {
      display: flex;
      gap: 3px;
      height: 13px;
      margin: 0 0 12px;
      flex: none;
    }
    .lane i {
      background: #fff;
      border: 2.5px solid var(--navy);
      border-radius: 3px;
    }
    .lane i.ok {
      background: var(--hit);
    }
    .lane i.no {
      background: #ff5f5f;
    }
    .lane i.cur {
      background: linear-gradient(90deg, var(--yel) 58%, #fff 58%);
    }
    .line {
      background: #fff;
      border: 3.5px solid var(--navy);
      border-radius: 14px;
      box-shadow: 0 5px 0 var(--navy);
      font-family: "Mochiy Pop One";
      font-size: 18px;
      line-height: 1.75;
      text-align: center;
      padding: 10px 12px;
      flex: none;
      position: relative;
    }
    .line rt {
      font-size: 9px;
    }
    .mid {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 78px;
      margin: 8px 0 6px;
      padding: 0 4px;
      flex: none;
    }
    .combo b {
      display: block;
      font-size: 34px;
      line-height: 1;
      font-weight: 400;
    }
    .combo span {
      font-size: 11px;
    }
    .judge {
      margin-left: auto;
      font-size: 26px;
      transform: rotate(-7deg);
      color: var(--yel);
    }
    .ans {
      border: 3.5px solid var(--navy);
      border-radius: 12px;
      box-shadow: 0 5px 0 var(--navy);
      font-weight: 600;
      font-size: 15px;
      line-height: 1.25;
      padding: 10px 14px;
      margin-bottom: 10px;
      position: relative;
      flex: none;
      background: #ff9fd0;
    }
    .ans.m {
      background: var(--mint);
    }
    .ans.hit {
      background: var(--yel);
    }
    .ans.dim {
      opacity: 0.5;
    }
    .ans.hit::after {
      content: "✓";
      position: absolute;
      right: -8px;
      top: -12px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--hit);
      border: 3px solid var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-family: sans-serif;
    }
    .qbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: auto -14px 0;
      background: var(--navy);
      border-top: 3px solid #fff;
      padding: 10px 14px 18px;
      flex: none;
    }
    .qbar .cov {
      width: 34px;
      height: 34px;
      border: 2px solid #fff;
    }
    .qbar .time {
      flex: 1;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
    }
    .qbar .time small {
      color: #7fa6d6;
      font-weight: 600;
    }
    .qbar .pb {
      flex: 1;
      height: 8px;
      background: #334a78;
      border-radius: 4px;
      overflow: hidden;
    }
    .qbar .pb i {
      display: block;
      height: 100%;
      width: 30%;
      background: var(--yel);
    }
    .qbar .tb {
      width: 32px;
      height: 32px;
      box-shadow: none;
      border-width: 2.5px;
    }
    .qbar .tb.big {
      width: 40px;
      height: 40px;
    }

    /* clip review */
    .nb {
      color: #fff;
      font-family: "Mochiy Pop One";
      font-size: 12px;
      text-shadow: 1px 1px 0 var(--navy);
      opacity: 0.75;
      text-align: center;
      margin: 4px 0;
    }
    .fix {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin: 10px 0 12px;
      font-weight: 700;
      color: #fff;
      text-shadow: 1px 1px 0 var(--navy);
      flex: none;
    }
    .fix .tb {
      width: auto;
      height: 30px;
      border-radius: 10px;
      padding: 0 10px;
      font-size: 12px;
      text-shadow: none;
      color: var(--navy);
    }
    .play {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex: none;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      text-shadow: 1px 1px 0 var(--navy);
    }
    .next {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
      flex: none;
    }
    .pill {
      display: inline-block;
      border: 3px solid var(--navy);
      border-radius: 12px;
      padding: 2px 9px;
      font-size: 12px;
      background: var(--yel);
      font-weight: 700;
    }

    .lane i.pst {
      background: #a9c4ea;
    }
    .lane i.lm {
      background: var(--pink);
    }
    .upnext {
      color: #fff;
      font-family: "Mochiy Pop One";
      font-size: 13px;
      line-height: 1.4;
      text-shadow: 2px 2px 0 var(--navy);
    }
    .upnext small {
      display: block;
      font-family: "Fredoka";
      font-size: 11px;
      color: #a9c4ea;
      text-shadow: none;
      font-weight: 700;
    }
    .chibi.idle {
      animation: bob 1.1s ease-in-out infinite alternate;
    }
    .chibi.idle .arm {
      animation: none;
      transform: rotate(0);
    }
    .chibi.idle .m {
      height: 2px;
      background: #1a1a1a;
      border-radius: 2px;
    }
    @keyframes bob {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-3px);
      }
    }
    .lyr {
      flex: 1;
      overflow: hidden;
      position: relative;
      -webkit-mask-image: linear-gradient(transparent 0, #000 14%, #000 82%, transparent 100%);
      mask-image: linear-gradient(transparent 0, #000 14%, #000 82%, transparent 100%);
    }
    .lyin {
      padding-top: 4px;
    }
    .lyr p {
      font-family: "Mochiy Pop One";
      font-size: 14px;
      line-height: 1.5;
      margin: 0 2px 10px;
      color: #fff;
      text-shadow: 2px 2px 0 var(--navy);
    }
    .lyr p.past {
      opacity: 0.75;
    }
    .lyr p.tap {
      opacity: 1;
      background: rgba(16, 34, 74, 0.35);
      border-radius: 10px;
      padding: 4px 8px;
      margin-left: -6px;
      margin-right: -6px;
    }
    .lyr .jump {
      display: block;
      font-family: "Fredoka";
      font-size: 11px;
      color: var(--yel);
      text-shadow: none;
      font-weight: 700;
    }
    .lyr p.now {
      background: #fff;
      color: var(--navy);
      text-shadow: none;
